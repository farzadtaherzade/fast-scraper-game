<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GamePulse Monitor</title><style>
:root{color-scheme:dark;--bg:#0b1017;--panel:#121a24;--line:#233043;--text:#eef4fb;--muted:#8fa0b5;--accent:#7c9cff;--good:#56d6a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#1a2744 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px 20px 48px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:28px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px}.title{font-size:clamp(28px,5vw,48px);line-height:1.05;margin:7px 0 10px;letter-spacing:-.04em}.sub{color:var(--muted);max-width:620px;margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#172334;color:var(--text);padding:11px 15px;border-radius:10px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#09101d}.btn:disabled{opacity:.55;cursor:wait}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:15px;padding:18px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:30px;font-weight:800;margin-top:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}.toolbar h2{font-size:18px;margin:0}.status{color:var(--muted);font-size:12px}.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.article{display:flex;flex-direction:column;gap:10px}.article-head{display:flex;justify-content:space-between;gap:12px}.source{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.1em}.date{color:var(--muted);font-size:11px;white-space:nowrap}.article h3{font-size:17px;line-height:1.25;margin:0}.article p{color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.read{color:var(--text);font-weight:700;text-decoration:none;margin-top:auto}.empty{text-align:center;color:var(--muted);padding:45px}.toast{position:fixed;right:18px;bottom:18px;background:#1e2d42;border:1px solid var(--line);padding:12px 15px;border-radius:10px;display:none}@media(max-width:700px){main{padding:20px 14px}.top{flex-direction:column}.stats{grid-template-columns:1fr}.feed{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}}
</style></head><body><main><header class="top"><div><div class="eyebrow">GamePulse / live monitor</div><h1 class="title">Game news, without the noise.</h1><p class="sub">A single view of the latest stories collected from trusted gaming feeds, with one-click publishing to your Telegram channel.</p></div><div class="actions"><button class="btn" id="refresh">Refresh sources</button><button class="btn primary" id="send">Send latest to Telegram</button></div></header><section class="stats"><div class="card"><div class="stat-label">STORIES CACHED</div><div class="stat-value" id="count">—</div></div><div class="card"><div class="stat-label">SOURCES TRACKED</div><div class="stat-value" id="sources">—</div></div><div class="card"><div class="stat-label">LAST UPDATE</div><div class="stat-value" id="updated" style="font-size:20px;margin-top:12px">—</div></div></section><div class="toolbar"><h2>Latest stories</h2><span class="status" id="status">Loading feed…</span></div><section class="feed" id="feed"></section></main><div class="toast" id="toast"></div><script>
const feed=document.querySelector('#feed'),toast=document.querySelector('#toast');function notify(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',3500)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formatDate(s){try{return new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch{return 'Unknown'}}async function load(){const r=await fetch('/api/articles');if(!r.ok)throw Error('Feed unavailable');const items=await r.json();document.querySelector('#count').textContent=items.length;document.querySelector('#sources').textContent=new Set(items.map(x=>x.source)).size;document.querySelector('#updated').textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});document.querySelector('#status').textContent=items.length?'Updated just now':'No stories yet';feed.innerHTML=items.length?items.map(x=>`<article class="card article"><div class="article-head"><span class="source">${esc(x.source)}</span><span class="date">${formatDate(x.published_date)}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><a class="read" href="${esc(x.url)}" target="_blank" rel="noreferrer">Read story ↗</a></article>`).join(''):'<div class="card empty">No stories cached. Refresh the sources to begin.</div>'}load().catch(()=>{document.querySelector('#status').textContent='Unable to load feed';feed.innerHTML='<div class="card empty">The feed is temporarily unavailable.</div>'});document.querySelector('#refresh').onclick=async()=>{const b=document.querySelector('#refresh');b.disabled=true;b.textContent='Refreshing…';try{const r=await fetch('/api/refresh',{method:'POST'});notify((await r.json()).message);setTimeout(load,1200)}catch{notify('Refresh failed')}finally{b.disabled=false;b.textContent='Refresh sources'}};document.querySelector('#send').onclick=async()=>{const b=document.querySelector('#send');b.disabled=true;b.textContent='Sending…';try{const r=await fetch('/api/telegram/send',{method:'POST'});notify((await r.json()).message)}catch{notify('Telegram send failed')}finally{b.disabled=false;b.textContent='Send latest to Telegram'}};
</script></body></html>
